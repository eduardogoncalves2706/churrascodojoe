name: CI
on: { pull_request: {} }
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: joe, POSTGRES_PASSWORD: joe, POSTGRES_DB: joe }
        ports: ['5433:5432']
        options: --health-cmd "pg_isready -U joe" --health-interval 5s --health-retries 10
    env: { DATABASE_URL: 'postgres://joe:joe@localhost:5433/joe', AUTH_MOCK: admin }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm db:migrate && pnpm db:seed
      - run: pnpm test
