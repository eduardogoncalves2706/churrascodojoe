name: Deploy
on: { push: { branches: [main] } }
permissions: { id-token: write, contents: read }
concurrency: deploy-prod
jobs:
  deploy:
    runs-on: ubuntu-latest
    env: { AWS_REGION: sa-east-1, CDK_DEFAULT_ACCOUNT: '${{ vars.AWS_ACCOUNT_ID }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: aws-actions/configure-aws-credentials@v4
        with: { role-to-assume: '${{ vars.AWS_DEPLOY_ROLE_ARN }}', aws-region: sa-east-1 }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @joe/web build   # placeholder p/ synth; rebuild com outputs abaixo
      - name: Deploy backend (dados, auth, api)
        working-directory: infra
        run: npx cdk deploy Joe-prod-Data Joe-prod-Auth Joe-prod-Api --require-approval never --outputs-file outputs.json
      - name: Migrations via Data API
        run: |
          export DB_DRIVER=data-api
          export DB_CLUSTER_ARN=$(jq -r '."Joe-prod-Data".ClusterArn' infra/outputs.json)
          export DB_SECRET_ARN=$(jq -r '."Joe-prod-Data".SecretArn' infra/outputs.json)
          export DB_NAME=$(jq -r '."Joe-prod-Data".DbName' infra/outputs.json)
          pnpm --filter @joe/api exec tsx src/db/migrate.ts
      - name: Build web com outputs do CDK e publica
        run: |
          export VITE_COGNITO_USER_POOL_ID=$(jq -r '."Joe-prod-Auth".UserPoolId' infra/outputs.json)
          export VITE_COGNITO_CLIENT_ID=$(jq -r '."Joe-prod-Auth".ClientId' infra/outputs.json)
          export VITE_COGNITO_REGION=sa-east-1
          pnpm --filter @joe/web build
          cd infra && npx cdk deploy Joe-prod-Web --require-approval never
